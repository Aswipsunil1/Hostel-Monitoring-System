<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hostel Staff - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-orange-100 to-orange-300 flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-8">

    <h2 class="text-2xl font-bold text-orange-600 mb-6 text-center">Add Hostel Staff</h2>

    <!-- Message Display -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="px-4 py-2 rounded text-white mb-2 
                      {% if message.tags == 'error' %} bg-red-500 {% else %} bg-green-500 {% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input type="text" name="fullname" placeholder="Full Name" required
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      <input type="tel" name="phone" placeholder="Phone Number" required
       pattern="[0-9]{10}" maxlength="10"
       title="Enter a 10-digit phone number"
       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      <input type="text" name="address" placeholder="Address" required
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      <input type="email" name="email" placeholder="Email" required
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      <input type="text" name="username" placeholder="Username" required
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      <input type="password" name="password" placeholder="Password" required
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400"/>
      
      <button type="submit"
              class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition-all duration-300">
        Add Staff
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{% url 'admin_dashboard' %}" class="text-orange-600 hover:underline">Back to Dashboard</a>
    </div>
  </div>

</body>
</html>
