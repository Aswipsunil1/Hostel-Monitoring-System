<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Hotel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fff3e0, #f3e5f5, #e3f2fd);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    input:focus {
      border-color: #ff9800;
      box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="w-full p-4 flex justify-between items-center bg-white/80 shadow-md backdrop-blur-sm">
    <h1 class="text-xl font-bold text-orange-600">Hotel Monitoring</h1>
    <nav class="space-x-6 flex items-center">
      <a href="{% url 'home' %}" class="text-gray-700 hover:text-orange-600 font-medium">Home</a>
      <a href="{% url 'about' %}" class="text-gray-700 hover:text-orange-600 font-medium">About</a>
      <a href="{% url 'register' %}" class="text-gray-700 hover:text-orange-600 font-medium">Register</a>
      <a href="{% url 'login' %}" class="text-orange-700 font-semibold underline">Login</a>

      <!-- Official Login Button -->
      <a href="{% url 'official_login' %}"
         class="ml-6 px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 font-semibold shadow-md transition">
         Official Login
      </a>
    </nav>
  </header>

  <!-- LOGIN FORM -->
  <main class="flex-grow flex items-center justify-center px-4">
    <div class="max-w-md w-full glass-card rounded-2xl p-8 sm:p-10 mt-6 mb-10">
      <div class="text-center mb-6">
        <svg class="w-12 h-12 mx-auto text-orange-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18" />
        </svg>
        <h2 class="text-3xl font-bold mt-4 text-gray-800">Welcome Back</h2>
        <p class="text-gray-600 text-sm mt-1">Login to your Hotel Monitoring account</p>
      </div>

      {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
            <div class="bg-red-100 text-red-700 px-4 py-2 rounded">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your email" />
        </div>
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your password" />
        </div>
        <button type="submit"
          class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition-all duration-300">
          Log In
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-5">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-orange-600 font-semibold hover:underline">Sign up</a>
      </p>
    </div>
  </main>
</body>
</html>
