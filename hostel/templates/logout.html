<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logged Out - Hotel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fff3e0, #f3e5f5, #e3f2fd);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="w-full p-4 flex justify-between items-center bg-white/80 shadow-md backdrop-blur-sm">
    <h1 class="text-xl font-bold text-orange-600">Hotel Monitoring</h1>
    <nav class="space-x-6">
      <a href="{% url 'home' %}" class="text-gray-700 hover:text-orange-600 font-medium">Home</a>
      <a href="{% url 'about' %}" class="text-gray-700 hover:text-orange-600 font-medium">About</a>
      <a href="{% url 'register' %}" class="text-gray-700 hover:text-orange-600 font-medium">Register</a>
      <a href="{% url 'login' %}" class="text-gray-700 hover:text-orange-600 font-medium">Login</a>
    </nav>
  </header>

  <!-- LOGOUT CONFIRMATION -->
  <main class="flex-grow flex items-center justify-center px-4">
    <div class="max-w-md w-full glass-card rounded-2xl p-10 text-center mt-10 mb-16">
      <svg class="w-14 h-14 mx-auto text-orange-500 mb-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">You've been logged out</h2>
      <p class="text-gray-600 mb-6">Thank you for using Hotel Monitoring. See you next time!</p>
      <div class="space-y-3">
        <a href="{% url 'login' %}" class="inline-block w-full text-center bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-lg transition">
          Log In Again
        </a>
        <a href="{% url 'home' %}" class="inline-block w-full text-center bg-white hover:bg-gray-100 text-orange-600 font-semibold py-2 px-4 rounded-lg border border-orange-300 transition">
          Return to Home
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full p-4 text-center text-gray-600 text-sm bg-white/80 backdrop-blur-sm">
    &copy; 2025 Hotel Monitoring. All rights reserved.
  </footer>

</body>
</html>
