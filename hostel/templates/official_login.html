<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Official Login - Hostel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e1f5fe, #fff3e0, #ede7f6);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full glass-card rounded-2xl p-8 sm:p-10 text-center">
    <h2 class="text-3xl font-bold text-orange-600 mb-4">Official Login</h2>
    <p class="text-gray-600 mb-8">Choose your role to continue</p>

    <!-- ✅ Message Display -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="px-4 py-3 rounded-lg text-white text-sm font-medium
                      {% if message.tags == 'error' %} bg-red-500 {% else %} bg-green-500 {% endif %} mb-2">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="flex flex-col space-y-4">
      <a href="{% url 'warden_login' %}" 
         class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition-all duration-300">
        Warden Login
      </a>

      <a href="{% url 'staff_login' %}" 
         class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition-all duration-300">
        Hostel Staff Login
      </a>
    </div>

    <a href="{% url 'login' %}" 
       class="block mt-6 text-sm text-orange-600 hover:underline">
      Back to User Login
    </a>
  </div>
</body>
</html>
