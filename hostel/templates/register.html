<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Hotel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fff3e0, #f3e5f5, #e3f2fd);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    input:focus, textarea:focus {
      border-color: #ff9800;
      box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  
  <!-- NAVBAR -->
  <header class="w-full p-4 flex justify-between items-center bg-white/80 shadow-md backdrop-blur-sm">
    <h1 class="text-xl font-bold text-orange-600">Hotel Monitoring</h1>
    <nav class="space-x-6">
      <a href="{% url 'home' %}" class="text-gray-700 hover:text-orange-600 font-medium">Home</a>
      <a href="{% url 'about' %}" class="text-gray-700 hover:text-orange-600 font-medium">About</a>
      <a href="{% url 'register' %}" class="text-orange-700 font-semibold underline">Register</a>
      <a href="{% url 'login' %}" class="text-gray-700 hover:text-orange-600 font-medium">Login</a>
      
    </nav>
  </header>

  <!-- REGISTRATION FORM -->
  <main class="flex-grow flex items-center justify-center px-4">
    <div class="max-w-md w-full glass-card rounded-2xl p-8 sm:p-10 mt-6 mb-10">

      <!-- Django Messages -->
{% if messages %}
  <div class="mb-6">
    <ul>
      {% for message in messages %}
        {% if message.tags != 'info' %}
          <li class="text-sm 
            {% if message.tags == 'error' %}text-red-600
            {% elif message.tags == 'success' %}text-green-600
            {% else %}text-gray-600{% endif %}">
            {{ message }}
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
{% endif %}


      <div class="text-center mb-6">
        <svg class="w-12 h-12 mx-auto text-orange-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m0 0l-3-3m3 3l3-3" />
        </svg>
        <h2 class="text-3xl font-bold mt-4 text-gray-800">Create Account</h2>
        <p class="text-gray-600 text-sm mt-1">Register for Hotel Monitoring</p>
      </div>

      <!-- FORM START -->
      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" id="name" name="name" required
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your full name" />
        </div>

        <!-- EMAIL VALIDATION -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            title="Enter a valid email address (example@domain.com)"
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your email" />
        </div>

        <!-- PHONE VALIDATION -->
        <div class="mb-4">
          <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="tel" id="phone" name="phone" required
            pattern="^[0-9]{10}$"
            title="Enter a valid 10-digit phone number"
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your phone number" />
        </div>

        <div class="mb-4">
          <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
          <textarea id="address" name="address" rows="3" required
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter your address"></textarea>
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
            minlength="6"
            title="Password must be at least 6 characters"
            class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition text-gray-800 bg-white"
            placeholder="Enter a secure password" />
        </div>

        <button type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition">
          Register
        </button>
      </form>
      <!-- FORM END -->

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full p-4 text-center text-gray-600 text-sm bg-white/80 backdrop-blur-sm">
    &copy; 2025 Hotel Monitoring. All rights reserved.
  </footer>

</body>
</html>
