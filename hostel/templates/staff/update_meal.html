<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Update {{ meal.day }} Meals</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">

    <h2 class="text-2xl font-bold text-blue-700 mb-4">Update Meals for {{ meal.day }}</h2>

    <form method="POST">
      {% csrf_token %}
      <label class="block font-medium mb-1">Breakfast</label>
      <input type="text" name="breakfast" value="{{ meal.breakfast }}" required class="w-full border px-3 py-2 rounded mb-4">

      <label class="block font-medium mb-1">Lunch</label>
      <input type="text" name="lunch" value="{{ meal.lunch }}" required class="w-full border px-3 py-2 rounded mb-4">

      <label class="block font-medium mb-1">Dinner</label>
      <input type="text" name="dinner" value="{{ meal.dinner }}" required class="w-full border px-3 py-2 rounded mb-4">

      <div class="flex justify-between">
        <a href="{% url 'view_or_add_meals' %}" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          Cancel
        </a>
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
          Update
        </button>
      </div>
    </form>
  </div>
</body>
</html>
