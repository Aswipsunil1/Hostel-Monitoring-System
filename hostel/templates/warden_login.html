<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Warden Login - Hotel Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-100 to-orange-300">
  <div class="max-w-md w-full bg-white/70 backdrop-blur-md rounded-2xl shadow-xl p-8">
    <h2 class="text-3xl font-bold text-center text-orange-600 mb-4">Warden Login</h2>
    <p class="text-center text-gray-600 mb-6">Authorized access for hostel wardens</p>

    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="bg-red-100 text-red-700 px-4 py-2 rounded">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'warden_login' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="username" name="username" required
               class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"/>
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
               class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"/>
      </div>
      <button type="submit"
              class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition-all duration-300">
        Login as Warden
      </button>
    </form>

    <a href="{% url 'official_login' %}" class="block mt-4 text-center text-sm text-orange-600 hover:underline">Back</a>
  </div>
</body>
</html>
